name: TAIFEX Ingestion

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # Required secrets:
      # - GCP_PROJECT_ID
      # - GCS_BUCKET_NAME
      # - GCP_SERVICE_ACCOUNT_KEY_JSON
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
      # Runtime configuration (optional repository variables)
      TAIFEX_ENV: ${{ vars.TAIFEX_ENV || 'production' }}
      TAIFEX_LOG_LEVEL: ${{ vars.TAIFEX_LOG_LEVEL || 'INFO' }}
      TAIFEX_MAX_RETRIES: ${{ vars.TAIFEX_MAX_RETRIES || '3' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Run TAIFEX ingestion (all sources)
        run: |
          set -euo pipefail
          echo "Running ingestion for all configured sources"
          python -m txfno_data_bot run all
